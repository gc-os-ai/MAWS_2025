[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maws"
version = "0.2.0.dev0"
description = "MAWS: residue-based chemistry, complex preparation, and OpenMM routines for aptamer workflows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "German Center for Open Source AI", email = "info@gcos.ai" },
]
maintainers = [
  { name = "German Center for Open Source AI", email = "info@gcos.ai" },
]
keywords = [
  "aptamer",
  "bioinformatics",
  "maws",
  "molecular-docking",
  "openmm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Runtime dependencies
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "openmm>=8.0",
  "mpmath>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "ruff>=0.12",
  "pre-commit",
]
# For GPU acceleration (CUDA)
gpu = [
  "openmm-cuda",
]

[project.scripts]
maws = "maws.cli:main"

[project.urls]
Homepage = "https://github.com/gc-os-ai/MAWS_2025"
Repository = "https://github.com/gc-os-ai/MAWS_2025"
Issues = "https://github.com/gc-os-ai/MAWS_2025/issues"
Pyaptamer = "https://github.com/gc-os-ai/pyaptamer"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["maws*"]

[tool.setuptools.package-data]
# Marks the package as carrying type annotations, so type checkers and editors
# use them instead of treating every import from maws as untyped.
maws = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["__pycache__", ".venv", "build", "dist", ".git"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N", "C4"]
ignore = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests", "maws"]
# Puts tests/ on the import path, so a helper module such as tests/bond_checks.py
# can be imported by name from any tier of the suite.
pythonpath = ["tests"]
# --doctest-modules runs every Examples block in the package as a test, so a
# docstring that shows output the code no longer produces fails the build.
# Integration tests need AmberTools and OpenMM, so they are excluded here and
# run on request with: pytest -m integration
addopts = "-ra --doctest-modules -m 'not integration'"
markers = [
  "integration: marks tests as integration tests (require AmberTools/OpenMM)",
  "slow: marks tests as slow running",
  "gpu: marks tests that require GPU",
]
